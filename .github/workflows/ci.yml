name: Extension checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Credit tracker unit and privacy tests
        working-directory: extensions/ai-credits-usage-tracker
        run: npm test
      - name: Restore keep-awake development dependencies
        working-directory: extensions/agent-keep-awake
        run: npm ci --ignore-scripts
      - name: Keep-awake type check
        working-directory: extensions/agent-keep-awake
        run: npm run typecheck
      - name: Keep-awake synthetic unit tests
        working-directory: extensions/agent-keep-awake
        run: npm test
