name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · VS Code ${{ matrix.vscode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        vscode: [stable]
        include:
          # Oldest supported VS Code (engines.vscode).
          - os: ubuntu-latest
            vscode: 1.95.0
          - os: windows-latest
            vscode: 1.95.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        if: matrix.vscode == 'stable'
        run: npm run typecheck

      - name: Unit tests
        if: matrix.vscode == 'stable'
        run: npm test

      - name: Real OS verification (holds a real power request, checks the OS sees it, crash-tests cleanup)
        if: matrix.vscode == 'stable'
        run: npm run test:os

      - name: Integration tests in VS Code (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}

      - name: Integration tests in VS Code
        if: runner.os != 'Linux'
        run: npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
